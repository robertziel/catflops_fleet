# vllm.example.com — the fleet power buttons (power/README.md). PREPARED, applied only
# after the operator's go. Two NEW locations, inserted into the 443 server block of
# /etc/nginx/sites-available/vllm.example.com immediately BEFORE the existing
# `location / {`. Nothing else in the vhost changes: `location /` (its auth_basic_user_file
# /etc/nginx/.htpasswd_gateway, proxy, SSE settings) and the other routes stay byte-identical.
#
# Why exact-match `location = /` and not sub_filter on `location /`: the injection must reach the
# panel page only. With `= /`, API clients (/v1/*, /lb/*, SSE streams) never enter a location
# that has sub_filter or a changed Accept-Encoding, so their responses are byte-identical by
# construction — not by a content-type filter that one mislabeled response could defeat.
#
# /etc/nginx/fleet-power-gate.conf (root:root 600, NOT in git) holds one line:
#     proxy_set_header X-Power-Gate "<the secret in box-c:~/.config/fleet-power/gate_secret>";
#
# The Host forwarded (`proxy_set_header Host $host`, the public name) must be in power/.env POWER_ALLOWED_HOSTS and lb/.env
# LB_ALLOWED_HOSTS: both services answer 421 to any other name (the DNS-rebinding guard, host_guard.py).
#
# APPLY: power/install/edge-apply.sh (run on the edge as root; backs up, inserts, nginx -t, reloads,
# restores the backup if the test fails, and checks `location /` is unchanged).
# UNDO:  restore the backup it prints, `nginx -t && systemctl reload nginx`.

    # ── fleet power (vllm-power on box-c; power/README.md) ─────────────────────────────────
    # The panel page ONLY (exact match `= /`): everything `location /` does for it, plus one
    # injected <script>. Every other path (/v1/*, /lb/*, SSE, assets) still goes through
    # `location /` below, which this change does not touch.
    location = / {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd_gateway;

        proxy_pass http://127.0.0.1:8082;   # frps vhost_http_port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";   # sub_filter needs the body uncompressed
        proxy_http_version 1.1;

        # sub_filter_types defaults to text/html only: JSON, SSE, JS and CSS are never rewritten.
        sub_filter '</body>' '<script src="/power/button.js" defer></script></body>';
        sub_filter_once on;
    }

    # The power service: same basic auth; frps routes /power/ to the vllm-power frp client.
    # nginx REPLACES any client-sent X-Power-User / X-Power-Gate; the service trusts only these.
    location /power/ {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd_gateway;

        proxy_pass http://127.0.0.1:8082;   # frps vhost_http_port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Power-User $remote_user;
        include /etc/nginx/fleet-power-gate.conf;   # proxy_set_header X-Power-Gate "<secret>"; (root 600)
        proxy_set_header Authorization "";          # the password never reaches box-c
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        client_max_body_size 4k;
    }

