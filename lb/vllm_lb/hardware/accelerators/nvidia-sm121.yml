# NVIDIA Blackwell at compute capability 12.1 — the GB10 superchip's GPU (DGX Spark). An ACCELERATOR
# (vllm_lb/hardware/accelerators.py): what an engine's KERNELS are compiled for and can run, shared by every card type
# that names it. Every figure is {value, source}; value null = no source states it, and the source says why.
name: NVIDIA Blackwell, compute capability 12.1 (sm_121)
facts:
  arch: {value: sm_121, source: "NVIDIA, CUDA GPUs compute capability list (developer.nvidia.com/cuda-gpus): 'NVIDIA GB10 … 12.1'. This repo's GB10 images compile for its arch-specific target 12.1a / sm_121a (deploy/images/vllm/Dockerfile (stage glm53) TORCH_CUDA_ARCH_LIST=12.1a; deploy/images/vllm/Dockerfile (stage deepseek-v4-b12x) CUTE_DSL_ARCH=sm_121a), which no other compute capability runs (CUDA C++ Programming Guide, Feature Availability: arch-specific features are neither forward- nor cross-compatible) — so sm_120 is a different accelerator"}
  gpu_runtime: {value: nvidia, source: "an NVIDIA CUDA GPU, reached through Docker's NVIDIA runtime: lb/cluster/tp-rank starts each rank with `docker run --gpus all` (tp-rank:1761), the pair's every start on this fleet; a one-card node on it would take deploy/standalone/node-gpu.nvidia.yml"}
  platforms: {value: [linux/arm64], source: "NVIDIA DGX Spark User Guide, Hardware Overview (docs.nvidia.com/dgx/dgx-spark/hardware.html): '20-core Arm processor (10 Cortex-X925 + 10 Cortex-A725)' — the GB10 superchip carries the box's CPU, so every image for it is arm64 (deploy/images/build.sh builds --platform linux/arm64)"}
  precisions: {value: [bf16, fp16, fp8, nvfp4], source: "NVIDIA DGX Spark User Guide, Hardware Overview: fifth-generation Tensor Cores, 'up to 1 PFLOP at FP4 precision'; and measured on ONE idle GB10 of this project's pair 2026-09-30: torch.matmul bf16 96.5, torch._scaled_mm fp8 188.3, flashinfer.mm_fp4 (NVFP4) 323.2 TFLOP/s (types/gb10.yml peak_tflops); fp16 is the Tensor Cores' base type (CUDA C++ Programming Guide, Warp Matrix Functions: __half on every arch since 7.0)"}
  quant_formats: {value: [none, modelopt, modelopt_mixed, compressed-tensors, fp8, mlx], source: "each served on this project's GB10 pair (the model library's rows and their sources): modelopt_mixed (Qwen3.8 Flash-Next hibrid48 and 27B NVFP4 on vLLM and SGLang), modelopt (nvidia/Qwen3.8-Flash-Next-NVFP4 on TensorFold, 2026-10-29), compressed-tensors (GLM-5.3-Flash NVFP4 on vLLM, 2026-10-20), fp8 (DeepSeek-V4-Flash NVFP4 on the B12X vLLM, 2026-10-23: its config.json says fp8, the image runs it as deepseek_v4_fp8), mlx (TensorFold 0.6.6's MLX 4-bit, 2026-10-29), none (unquantised: a Parakeet node on NeMo, 2026-10-24)"}
