  parakeet-tdt-0.6b-v3: {path: parakeet-tdt-0.6b-v3}

# REFERENCE BLUEPRINTS (lb/vllm_lb/library/blueprints: the project's proven setups by hardware type) are no key of this
# file: the setup wizard proposes a blueprint's settings as this deployment's answers (SETUP.md; render.py --prefill),
# and what it renders is the settings themselves. A fleet still naming `blueprint` or `blueprints` is refused at boot.
