# The e2e front: the edge vhost's locations for /, = / and /power/ (deploy/nginx-edge-power.example.conf),
# with the frps hop replaced by the two containers it would reach. Basic auth as on the edge.
server {
    listen 8080;
    server_name front;

    location = / {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://panel:8000;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        sub_filter '</body>' '<script src="/power/button.js" defer></script></body>';
        sub_filter_once on;
    }

    location /power/ {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://power:8016;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Power-User $remote_user;
        include /etc/nginx/fleet-power-gate.conf;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        client_max_body_size 4k;
    }

    location / {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://panel:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_http_version 1.1;
    }
}
